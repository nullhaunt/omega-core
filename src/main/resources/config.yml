# Required settings are validated at startup. Changes require a server restart.
# Existing files are never merged with defaults or overwritten on startup.
server:
  # 1-64 letters/digits/underscores/hyphens; start with a letter or digit.
  id: "dev-01"
  # A lowercase label, such as development, staging or production (1-32 characters).
  environment: "development"

# PostgreSQL must be available before player admission opens.
database:
  host: "localhost"
  port: 5432
  database: "omega"
  username: "omega"
  # The variable NAME only. Never put a password in this file.
  # Its value must be nonblank in the server process environment at startup.
  password-env: "OMEGA_DB_PASSWORD"
  # Positive integer. Start small; tune using measurements.
  pool-size: 5

# Controlled startup/migration and connection timing detail; requires restart.
# Never logs credentials, player identity, connection address or raw SQL/errors.
debug: false
